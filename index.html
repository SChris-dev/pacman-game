<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman</title>
    <link rel="shortcut icon" href="./assets/pacman.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="menuContainer">
        <h1>Pacman</h1>
        <h2>Character / Nickname</h2>
        <table>
            <tr>
                <td><img src="./assets/red_ghost.png" alt="" width="75"></td>
                <td>- bojan</td>
                <td>'reddy'</td>
            </tr>
            <tr>
                <td><img src="./assets/blue_ghost.png" alt="" width="75"></td>
                <td>- soblu</td>
                <td>'bluey'</td>
            </tr>
            <tr>
                <td><img src="./assets/pink_ghost.png" alt="" width="75"></td>
                <td>- pinku</td>
                <td>'inky'</td>
            </tr>
            <tr>
                <td><img src="./assets/yellow_ghost.png" alt="" width="75"></td>
                <td>- yollu</td>
                <td>'clyde'</td>
            </tr>
        </table>

        <img src="./assets/pacman.png" alt="" width="75">
        <h2>Press enter to start the game</h2>
    </div>

    <div id="gameContainer">
        <canvas id="canvas"></canvas>
    </div>

    <script src="menu.js"></script>
    <script src="script.js"></script>
</body>
</html>
